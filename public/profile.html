<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>Tienda Virtual</title>
  </head>
  <body>
    <header>
      <div class="header-container">
        <a href="./index.html" class="header-logo">
          <img
            class="header-logo-img"
            src="./assets/tiendamia-logo.svg"
            width="218"
            alt="Logo store"
          />
        </a>
        <form class="header-form">
          <input
            class="header-input"
            type="text"
            placeholder="Search"
            id="search"
          />
        </form>
        <ul class="header-social"></ul>
      </div>
      <nav id="navbar"></nav>
    </header>
    <section class="hero-section">
      <article class="hero-title">
        <span class="hero-span">tecnología</span>
        <span class="hero-span">renovada</span>
      </article>
    </section>
    <main
      class="d-flex w-100 flex-grow-1"
      style="padding-top: 100px !important"
    >
      <section class="d-flex flex-column align-items-center w-100">
        <section
          class="d-flex flex-column justify-content-center align-items-center w-25 m-3"
        >
          <h5 class="m-2 p-2 text-center">EMAIL:</h5>
          <h5 class="m-2 p-2 text-center">ROLE:</h5>
          <!-- <img
              style="width: 360px; height: 360px"
              class="m-2 object-fit-cover"
              src="{{profile.photo}}"
            /> -->
        </section>
      </section>
    </main>
    <footer>
      <div id="footer" class="footer-container"></div>
      <div class="footer-copyright">PROGRAMACION BACKEND 2024</div>
    </footer>
  </body>
  <!-- <script src="./scripts/index.js" type="module"></script> -->
</html>
